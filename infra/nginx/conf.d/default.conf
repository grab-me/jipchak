server {
    listen 80;
    server_name k14d108.p.ssafy.io;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name k14d108.p.ssafy.io;

    # SSL 인증서 경로
    ssl_certificate /etc/letsencrypt/live/k14d108.p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/k14d108.p.ssafy.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # =====================================================================
    # 보안 헤더 (1단계 핫픽스)
    # `always` 플래그를 붙여 4xx/5xx 응답에도 전달.
    # CSP 는 사이트가 깨질 위험이 있어 별도 작업으로 분리.
    # =====================================================================

    # HTTPS 강제. 2년 유지 + 서브도메인까지 적용 + preload 후보.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # 클릭재킹 차단. 이 사이트는 어디에서도 iframe 으로 임베드되지 않는다.
    add_header X-Frame-Options DENY always;

    # MIME 스니핑 차단. 업로드된 영상이 잘못된 Content-Type 으로 실행되는 사고 방지.
    add_header X-Content-Type-Options nosniff always;

    # 외부 사이트로 이동 시 경로/쿼리 정보가 새는 것 차단.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 브라우저 권한 차단. 키오스크는 라즈베리파이 카메라 영상을 받아 쓰므로
    # 브라우저 자체 카메라/마이크/지오로케이션 권한은 전혀 사용하지 않음.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # 프론트엔드 (별도 컨테이너 프록시)
    location / {
        proxy_pass http://frontend-jipchak:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 백엔드 REST API
    location /api/ {
        proxy_pass http://app-jipchak:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 영상 다운로드 (Spring WebConfig 의 /videos/** ResourceHandler 가 서빙)
    # 사용자가 QR 스캔 후 핸드폰에서 mp4 받을 때 이 경로 사용.
    location /videos/ {
        proxy_pass http://app-jipchak:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # AI 서버 REST (현재는 /health 정도. 운영 디버그용)
    # 끝 슬래시(/) 로 prefix /ai/ 를 제거하고 백엔드에 전달 — /ai/health → /health
    location /ai/ {
        proxy_pass http://ai-jipchak:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # AI 서버 WebSocket (영상 스트리밍)
    #   - RPi → AI:        wss://<도메인>/ws/camera  (영상 송신)
    #   - 브라우저 ← AI:    wss://<도메인>/ws/stream  (라이브 미리보기 수신)
    location /ws/ {
        proxy_pass http://ai-jipchak:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # 영상 스트림은 장기 연결. 기본 60초 타임아웃이면 1분 후 끊김.
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
